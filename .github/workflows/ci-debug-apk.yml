name: Installable debug APK

# A stable signing key lets the APK from a later merge update the previous CI build
# without uninstalling it and losing local preferences. Never run untrusted PR code with this key.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build updateable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Load persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RKD_CI_KEYSTORE_BASE64 || secrets.FOCUS_CI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RKD_CI_KEYSTORE_PASSWORD || secrets.FOCUS_CI_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo 'Configure RKD_CI_KEYSTORE_BASE64 and RKD_CI_KEYSTORE_PASSWORD (or FOCUS_CI_KEYSTORE_BASE64 and FOCUS_CI_KEYSTORE_PASSWORD) repository secrets.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/focus-ci.p12"
          echo "RKD_CI_KEYSTORE_PATH=$RUNNER_TEMP/focus-ci.p12" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          RKD_CI_KEYSTORE_PASSWORD: ${{ secrets.RKD_CI_KEYSTORE_PASSWORD || secrets.FOCUS_CI_KEYSTORE_PASSWORD }}
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rkd-launcher-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
